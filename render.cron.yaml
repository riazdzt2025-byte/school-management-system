# Ops-only Render Blueprint for the daily backup cron.
#
# NOTE: this is a TEMPLATE for the owner to apply/adjust in the Render dashboard
# or Blueprint. It defines ONLY a scheduled backup cron job — it deliberately
# does NOT redefine the existing web service (which is deployed today without a
# render.yaml), so applying this file will not recreate or alter the live app.
#
# Owner actions / decisions required (see docs/OWNER_RENDER_OPS_TUTORIAL.md):
#   * A cron job has NO PERSISTENT DISK and can't read another service's disk.
#     Its filesystem is wiped after each run. To keep a backup you MUST upload it
#     to OBJECT STORAGE (R2/S3) after `backup_data`, or run the backup from a
#     BACKGROUND WORKER that does have a disk. `P0B_BACKUP_ROOT` alone does NOT
#     persist on a cron job — it is only a staging path on the cron.
#   * Cron Jobs have no free tier — this runs on a paid plan (>= $1/month).
#   * Confirm Postgres tooling (pg_dump/pg_restore) exists in the runtime, and
#     that DATABASE_URL is set (never commit the password).
#   * Create a health check (e.g. Healthchecks.io) and set HEALTHCHECK_PING_URL;
#     `backup_cron.sh` pings <url> on success and <url>/fail on failure. A
#     non-zero exit also lets Render's own failure notifications fire.
#
# Environment variables are owned by you (sync: false) so no secrets are stored
# in this file. Object-storage upload vars (e.g. R2/S3) are owner-supplied too.

services:
  - type: cron
    name: sms-daily-backup
    runtime: python
    # Daily at 02:00 UTC (adjust to your local night).
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/backup_cron.sh
    envVars:
      # Owner fills these in the Render dashboard; never commit real values.
      - key: P0B_BACKUP_ROOT
        sync: false
      - key: HEALTHCHECK_PING_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Object-storage upload (durable off-box copy) — set whichever you use.
      - key: BACKUP_OBJECT_STORAGE_URL
        sync: false
      - key: BACKUP_OBJECT_STORAGE_BUCKET
        sync: false
      - key: BACKUP_OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: BACKUP_OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: BACKUP_OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: BACKUP_MAX_AGE_HOURS
        value: "48"
      - key: KEEP_BACKUPS
        value: "7"
