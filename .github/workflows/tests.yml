name: Django tests

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SQLite (the local default) — no external DB.
          - name: sqlite
            python-version: "3.12"
          # Postgres (P1-10) — run the suite against a real Postgres so the
          # conditional unique constraints and everything else are proven on
          # the engine production is expected to use.
          - name: postgres
            python-version: "3.12"
            postgres: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: school_system.settings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations in sync (no missing migrations)
        run: python manage.py makemigrations --check

      - name: Run test suite (${{ matrix.name }})
        run: |
          # P1-10: point at the real Postgres service only for the postgres job;
          # the sqlite job keeps the local default (no DATABASE_URL).
          if [ "${{ matrix.postgres }}" = "true" ]; then
            export DATABASE_URL="postgres://postgres:postgres@localhost:5432/sms_test"
          fi
          python manage.py test students --verbosity 1

      # pg_dump/pg_restore are what make the Postgres drill meaningful. They are
      # preinstalled on the runner image today; install them if that ever stops
      # being true, so a missing client fails loudly here instead of silently
      # skipping the backup path.
      - name: Ensure PostgreSQL client tools
        if: matrix.postgres
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version

      # End-to-end backup -> restore on DISPOSABLE data only. The script creates
      # its own drill databases (postgres job) or a drill file (sqlite job),
      # refuses to run if the resolved target is not one of them, and deletes
      # everything on exit. It never touches sms_test or any real MEDIA_ROOT.
      - name: Backup / restore smoke test (${{ matrix.name }})
        run: |
          if [ "${{ matrix.postgres }}" = "true" ]; then
            ./scripts/backup_smoke_test.sh \
              --postgres "postgres://postgres:postgres@localhost:5432/postgres"
          else
            ./scripts/backup_smoke_test.sh
          fi

  # Zero-dependency Node tests for static/students/js/student_row_actions.js —
  # the checkbox tracker that keeps the student list's row action buttons
  # disabled until the row's checkbox is ticked.
  js-row-actions:
    runs-on: ubuntu-latest
    name: Node row-action button tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node.js unit tests
        run: node --test students/js/*.test.js
