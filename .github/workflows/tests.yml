name: Django tests

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SQLite (the local default) — no external DB.
          - name: sqlite
            python-version: "3.12"
          # Postgres (P1-10) — run the suite against a real Postgres so the
          # conditional unique constraints and everything else are proven on
          # the engine production is expected to use.
          - name: postgres
            python-version: "3.12"
            postgres: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: school_system.settings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations in sync (no missing migrations)
        run: python manage.py makemigrations --check

      # --- Production settings guards (SEC session-02) -----------------------
      # The settings module refuses to boot with the dev fallback SECRET_KEY
      # when DEBUG=False, and students.E016 fails `check --deploy` when
      # ALLOWED_HOSTS stays on the '*' dev fallback. The three steps below prove
      # both gates keep working — with ONLY ephemeral CI values (a throwaway
      # key and a .invalid host), never real production secrets or hosts.
      - name: Deploy guard — fallback SECRET_KEY rejected when DEBUG=False
        env:
          DEBUG: "False"
        run: |
          if python manage.py check --deploy; then
            echo "::error::DEBUG=False booted with the fallback SECRET_KEY — settings guard is broken"
            exit 1
          fi

      - name: Deploy guard — wildcard ALLOWED_HOSTS rejected when DEBUG=False (students.E016)
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set +e
          output=$(python manage.py check --deploy 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::check --deploy passed with ALLOWED_HOSTS=['*'] — students.E016 guard is broken"
            exit 1
          fi
          echo "$output" | grep -q 'students.E016' \
            || { echo "::error::deploy check failed, but not via students.E016 — investigate"; exit 1; }

      - name: Deploy guard — production-shaped config passes check --deploy
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}"
          ALLOWED_HOSTS: "ci.example.invalid,localhost"
          CSRF_TRUSTED_ORIGINS: "https://ci.example.invalid"
          TRUST_FORWARDED_PROTO: "True"
          USE_X_FORWARDED_HOST: "True"
        run: python manage.py check --deploy

      - name: Run test suite (${{ matrix.name }})
        run: |
          # P1-10: point at the real Postgres service only for the postgres job;
          # the sqlite job keeps the local default (no DATABASE_URL).
          if [ "${{ matrix.postgres }}" = "true" ]; then
            export DATABASE_URL="postgres://postgres:postgres@localhost:5432/sms_test"
          fi
          python manage.py test students --verbosity 1

      # pg_dump/pg_restore are what make the Postgres drill meaningful. They are
      # preinstalled on the runner image today; install them if that ever stops
      # being true, so a missing client fails loudly here instead of silently
      # skipping the backup path.
      - name: Ensure PostgreSQL client tools
        if: matrix.postgres
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version

      # End-to-end backup -> restore on DISPOSABLE data only. The script creates
      # its own drill databases (postgres job) or a drill file (sqlite job),
      # refuses to run if the resolved target is not one of them, and deletes
      # everything on exit. It never touches sms_test or any real MEDIA_ROOT.
      - name: Backup / restore smoke test (${{ matrix.name }})
        run: |
          if [ "${{ matrix.postgres }}" = "true" ]; then
            ./scripts/backup_smoke_test.sh \
              --postgres "postgres://postgres:postgres@localhost:5432/postgres"
          else
            ./scripts/backup_smoke_test.sh
          fi

      # Off-box copy round trip. moto speaks real S3 over HTTP (signing,
      # pagination, head/delete), so this exercises the same boto3 code path a
      # production bucket would — without a paid bucket or a real credential.
      # It proves the copy is a restore SOURCE, not just a write: upload,
      # `check_backups --check-remote`, `fetch_backup`, restore from the fetched
      # bundle, and remote retention pruning. The drill creates the bucket and
      # deletes it again on exit.
      - name: Install a local S3-compatible mock (moto)
        run: pip install "moto[server]==5.2.3"

      - name: Off-box backup drill (${{ matrix.name }})
        run: |
          nohup moto_server -H 127.0.0.1 -p 5055 >/tmp/moto.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/data.json && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/data.json \
            || { echo "moto_server did not start:"; cat /tmp/moto.log; exit 1; }
          if [ "${{ matrix.postgres }}" = "true" ]; then
            ./scripts/backup_smoke_test.sh --s3-endpoint http://127.0.0.1:5055 \
              --postgres "postgres://postgres:postgres@localhost:5432/postgres"
          else
            ./scripts/backup_smoke_test.sh --s3-endpoint http://127.0.0.1:5055
          fi

  # Zero-dependency Node tests for static/students/js/student_row_actions.js —
  # the checkbox tracker that keeps the student list's row action buttons
  # disabled until the row's checkbox is ticked.
  js-row-actions:
    runs-on: ubuntu-latest
    name: Node row-action button tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node.js unit tests
        run: node --test students/js/*.test.js
