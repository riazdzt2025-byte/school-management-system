<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Board Result</title><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f7fa}.box{max-width:620px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 14px #0f2d5215}</style></head><body><main class="box"><h1>{% if result %}Edit{% else %}Publish{% endif %} Board Result</h1><p class="text-muted">{{ registration.student.name }} — {{ registration.registration_number }}</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save Result</button> <a class="btn btn-outline-secondary" href="{% url 'ssc_registration_list' %}">Cancel</a></form></main></body></html>
