{% extends 'students/base.html' %}

{% block title %}Clear Seat Plan - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Clear Seat Plan?</h1></div>
</div>

<div class="table-card p-4">
    <p>Remove all seat assignments for <strong>{{ exam.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Clear</button>
        <a class="btn btn-outline-navy" href="{% url 'seat_plan_list' exam.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
