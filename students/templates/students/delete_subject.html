{% extends 'students/base.html' %}

{% block title %}Delete Subject - Principal Kazi Faruky School And College{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Confirm Subject Deletion</h1>
</div>

<div class="table-card p-4" style="max-width:500px">
    <p>Are you sure you want to delete <strong>{{ subject.name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'subject_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
