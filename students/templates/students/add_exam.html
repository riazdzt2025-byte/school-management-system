{% extends 'students/base.html' %}

{% block title %}{% if exam %}Edit{% else %}New{% endif %} Exam - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{% if exam %}Edit{% else %}New{% endif %} Exam</h1>
    </div>
</div>

<div class="table-card p-4">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-navy">Save</button>
        <a class="btn btn-outline-navy" href="{% url 'exam_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
