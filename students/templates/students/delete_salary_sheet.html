{% extends 'students/base.html' %}

{% block title %}Delete Salary Sheet - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Delete Salary Sheet?</h1></div>
</div>

<div class="table-card p-4">
    <p>{{ salary.employee.name }} - {{ salary.month }} - BDT {{ salary.amount }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'salary_sheet_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
