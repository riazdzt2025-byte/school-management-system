{% extends 'students/base.html' %}

{% block title %}Delete Exam - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Delete Exam?</h1></div>
</div>

<div class="table-card p-4">
    <p>Delete <strong>{{ exam.name }}</strong>? All marks entered for this exam will also be deleted.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a class="btn btn-outline-navy" href="{% url 'exam_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
