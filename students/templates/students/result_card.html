{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Card - {{ result.student.name }}</title>
    <link rel="stylesheet" href="{% static 'students/css/result_card.css' %}">
</head>
<body class="result-card-page">
    <nav class="result-card-toolbar" aria-label="Result card actions">
        <span class="result-card-toolbar__hint">Print-ready student result card</span>
        <div class="result-card-toolbar__actions">
            <button type="button" class="result-card-toolbar__button" onclick="window.print()">Print result card</button>
            <a class="result-card-toolbar__button result-card-toolbar__button--quiet" href="{% url 'student_result_detail' exam.pk result.student.pk %}">Back to details</a>
        </div>
    </nav>
    {% include 'students/_result_card_body.html' with result=result %}
</body>
</html>
