<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Transfer Certificate</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 720px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Issue Transfer Certificate</h1>
                <p class="text-muted mb-4">Student: <strong>{{ student.name }}</strong> ({{ student.student_id }})</p>

                <div class="row g-2 mb-4">
                    <div class="col-md-4"><strong>Class:</strong> {{ student.admission_class }}</div>
                    <div class="col-md-4"><strong>Section:</strong> {{ student.section|default:'-' }}</div>
                    <div class="col-md-4"><strong>Roll:</strong> {{ student.roll_no|default:'-' }}</div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">Issue Certificate</button>
                        <a href="{% url 'student_detail' student.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
