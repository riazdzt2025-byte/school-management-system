<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Import SSC Registrations</title><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="card p-4 mx-auto mt-5" style="max-width:600px"><h2>Import SSC Registrations</h2><p class="text-muted">Columns: Student ID, Registration Number, Roll Number, Session, Group, Subjects, Board</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Upload and Import</button> <a class="btn btn-outline-secondary" href="{% url 'ssc_registration_list' %}">Cancel</a></form></main></body></html>
