{% extends 'students/base.html' %}

{% block title %}Delete Voucher - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Delete Voucher?</h1></div>
</div>

<div class="table-card p-4">
    <p>{{ voucher.purpose }} - ৳{{ voucher.amount }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'voucher_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
