{% extends 'students/base.html' %}

{% block title %}Delete Employee - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Delete Employee?</h1></div>
</div>

<div class="table-card p-4">
    <p>Delete <strong>{{ employee.name }}</strong>? Its status history will also be removed.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'employee_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
