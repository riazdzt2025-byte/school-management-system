{% extends 'students/base.html' %}

{% block title %}Delete Receipt - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Delete Receipt?</h1></div>
</div>

<div class="table-card p-4">
    <p>{{ receipt.receipt_no }} - {{ receipt.student.name }} - ৳{{ receipt.amount }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'money_receipt_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
