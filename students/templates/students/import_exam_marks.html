<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import Exam Marks</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="card p-4 mx-auto mt-5" style="max-width: 600px">
    <h2>Import Exam Marks</h2>
    <p class="text-muted">Columns: Student ID, Subject Code, Marks</p>
    <p class="text-muted">Marks must be between 0 and the subject full marks. The complete upload is rejected if any row is invalid.</p>
    {% if messages %}
        {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Upload and Import</button>
        <a class="btn btn-outline-secondary" href="{% url 'exam_list' %}">Cancel</a>
    </form>
</main>
</body>
</html>
