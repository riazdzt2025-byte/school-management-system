{% extends 'students/base.html' %}

{% block title %}Change Status - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Change Status</h1></div>
</div>

<div class="table-card p-4">
    <p>{{ employee.name }} - Current: <strong>{{ employee.get_status_display }}</strong></p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-navy">Update Status</button>
        <a href="{% url 'employee_list' %}" class="btn btn-outline-navy">Cancel</a>
    </form>
</div>
{% endblock %}
