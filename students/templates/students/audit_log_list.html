<!doctype html>
<html><head><title>Audit Log</title></head><body>
<h1>Audit Log</h1>
<table><tr><th>Time</th><th>Action</th><th>Model</th><th>Object</th><th>Actor</th><th></th></tr>
{% for log in logs %}<tr><td>{{ log.timestamp }}</td><td>{{ log.action }}</td><td>{{ log.model_name }}</td><td>{{ log.object_repr }}</td><td>{{ log.actor|default:'System' }}</td><td><a href="{% url 'audit_log_detail' log.pk %}">Details</a></td></tr>
{% empty %}<tr><td colspan="6">No audit events found.</td></tr>{% endfor %}</table>
</body></html>
