{% extends 'students/base.html' %}

{% block title %}Select Subject - {{ block.super }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Enter Marks - {{ exam.name }}</h1>
        <div class="subtitle">Class {{ exam.admission_class }}{% if exam.section %} ({{ exam.section }}){% endif %}</div>
    </div>
</div>

<div class="table-card p-4">
    <form method="post">
        {% csrf_token %}
        <select name="subject" class="form-select" required>
            <option value="">-- Select Subject --</option>
            {% for subject in subjects %}
            <option value="{{ subject.pk }}">{{ subject.name }} ({{ subject.full_marks }})</option>
            {% endfor %}
        </select>
        <button class="btn btn-navy mt-3">Continue</button>
        <a class="btn btn-outline-navy mt-3" href="{% url 'exam_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
