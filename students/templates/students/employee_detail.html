<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ employee.name }} — Employee Details</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --navy: #0F2D52; }
        body { font-family: 'Inter', sans-serif; background: #F6F7FA; padding: 40px; }
        .card-box { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 14px;
            box-shadow: 0 4px 14px rgba(15,45,82,0.06); padding: 32px; }
        h2 { color: var(--navy); }
        .row-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .row-item span:first-child { color: #6c757d; }
        .row-item span:last-child { font-weight: 600; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2>{{ employee.name }}</h2>
        <p class="text-muted">{{ employee.designation }}</p>
        <div class="row-item"><span>Department</span><span>{{ employee.department|default:"—" }}</span></div>
        <div class="row-item"><span>Institution</span><span>{{ employee.institution.name|default:"—" }}</span></div>
        <div class="row-item"><span>Join Date</span><span>{{ employee.join_date }}</span></div>
        <div class="row-item"><span>Contact No</span><span>{{ employee.contact_no|default:"—" }}</span></div>
        <div class="row-item"><span>Status</span><span>{{ employee.get_status_display }}</span></div>
        <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary mt-3">← Back to List</a>
    </div>
</body>
</html>
