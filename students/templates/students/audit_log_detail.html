<!doctype html>
<html><head><title>Audit Event</title></head><body>
<h1>Audit Event</h1>
<p><strong>Action:</strong> {{ log.action }}</p><p><strong>Model:</strong> {{ log.model_name }}</p><p><strong>Object:</strong> {{ log.object_repr }} ({{ log.object_id }})</p><p><strong>Actor:</strong> {{ log.actor|default:'System' }}</p><p><strong>Time:</strong> {{ log.timestamp }}</p>
<h2>Snapshot</h2><pre>{{ log.snapshot }}</pre><h2>Details</h2><pre>{{ log.details }}</pre>
<a href="{% url 'audit_log_list' %}">Back to audit log</a>
</body></html>
