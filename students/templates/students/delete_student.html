<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h1 class="mb-4">Delete Student</h1>
    <p>আপনি কি নিশ্চিত যে <strong>{{ student.name }}</strong> ({{ student.student_id }}) কে ডিলিট করতে চান?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">হ্যাঁ, Delete করুন</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">না, বাতিল করুন</a>
    </form>
</div>
</body>
</html>
