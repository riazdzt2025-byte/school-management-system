<!DOCTYPE html>
<html>
<head>
    <title>Principal Kazi Faruky School And College</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Principal Kazi Faruky School And College</a>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm me-2">Home</a>
            <a href="{% url 'student_list' %}" class="btn btn-outline-light btn-sm">Students</a>
            <form method="POST" action="{% url 'logout' %}" style="padding: 12px 20px;">
    {% csrf_token %}
    <button type="submit" style="background: none; border: none; color: rgba(255,255,255,0.75); padding: 0; font-size: 0.95rem; display: flex; align-items: center; gap: 10px;">
        <i class="bi bi-box-arrow-right"></i> Logout
    </button>
</form>
        </div>
    </div>
</nav>
<div class="container mt-5" style="max-width: 600px;">
    <h1 class="mb-4">Add / Edit Student</h1>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Save</button>
        <button type="submit" name="save_add_another" value="1" class="btn btn-outline-success">Save & Add Another</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
    // Class/semester list for each institution will be stored here
    const institutionClasses = {
        {% for inst in form.institution.field.queryset %}
        "{{ inst.id }}": [{% for c in inst.get_class_list %}"{{ c }}"{% if not forloop.last %},{% endif %}{% endfor %}]{% if not forloop.last %},{% endif %}
        {% endfor %}
    };

    const institutionSelect = document.getElementById('id_institution');
    const classSelect = document.getElementById('id_admission_class');
    const currentClassValue = "{{ form.instance.admission_class|default:'' }}";

    function populateClasses(selectedInstitutionId, preSelectValue) {
        classSelect.innerHTML = '<option value="">-- Select Class/Semester --</option>';
        const classes = institutionClasses[selectedInstitutionId] || [];
        classes.forEach(function(cls) {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            if (cls === preSelectValue) {
                option.selected = true;
            }
            classSelect.appendChild(option);
        });
    }

    institutionSelect.addEventListener('change', function() {
        populateClasses(this.value, '');
    });

    // Keep the previous selection when the page loads (Edit mode)
    if (institutionSelect.value) {
        populateClasses(institutionSelect.value, currentClassValue);
    }
</script>
</body>
</html>
