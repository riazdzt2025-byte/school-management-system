<!DOCTYPE html>
<html>
<head>
    <title>Login - Principal Kazi Faruky School And College</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="login-card shadow">
    <h3 class="text-center mb-4">Principal Kazi Faruky School And College</h3>
    <p class="text-center text-muted mb-4">Login to continue</p>

    {% if form.errors %}
    <div class="alert alert-danger">Incorrect username or password.</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
</div>
</body>
</html>
